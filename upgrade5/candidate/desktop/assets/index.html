<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>META</title><link rel="icon" href="/meta-icon.svg"><link rel="stylesheet" href="/app.css"></head>
<body data-theme="dark" data-accent="amber" data-density="compact" data-font="normal">
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><button class="brand-mark" id="collapseSidebar" title="Свернуть / развернуть меню"><img src="/meta-icon.svg" alt="META"></button><strong>META</strong></div>
 <div class="nav-primary"><button class="nav-link primary" id="newChat"><span data-i="plus"></span><span>Новый чат</span><kbd>Ctrl N</kbd></button><button class="nav-link" id="searchOpen"><span data-i="search"></span><span>Поиск</span><kbd>Ctrl K</kbd></button><button class="nav-link code-nav" id="codeOpen"><span data-i="code"></span><span>META Code</span><kbd>IDE</kbd></button><button class="nav-link" id="notesOpen"><span data-i="file-text"></span><span>Заметки</span></button><button class="nav-link" id="workspaceOpen"><span data-i="grid"></span><span>Рабочее пространство</span></button></div>
 <div class="sidebar-divider"></div><div class="section-title">Чаты <span id="chatCount"></span></div>
 <div class="chat-search"><span data-i="search"></span><input id="searchChats" placeholder="Найти чат"></div><div class="chat-list" id="chatList"></div>
 <div class="sidebar-foot"><button class="profile" id="profileOpen"><span class="avatar" id="avatarLetter">Л</span><span class="profile-label"><strong id="profileName">Локальный профиль</strong><small id="profileState">На этом устройстве</small></span></button></div>
</aside>
<div class="sidebar-shade" id="sidebarShade"></div>
<div class="workspace">
<header class="topbar"><button class="icon-button menu-mobile" id="openSidebar" title="Открыть меню"><span data-i="menu"></span></button><button class="workspace-title" id="headerHome"><span class="online-dot" id="onlineDot"></span><strong id="workspaceLabel">META</strong><span data-i="chevron-down"></span></button><div class="top-right"><span id="connectionText" class="connection-text">Подключение...</span><button class="icon-button" id="topNew" title="Новый чат"><span data-i="square-pen"></span></button></div></header>
<main class="chat-stage" id="chatStage"><div class="conversation" id="conversation"></div></main>
<div class="composer-area"><div class="quick-actions" id="quickActions"><button data-prompt="Помоги придумать идеи для нового проекта"><span data-i="lightbulb"></span>Придумать идеи</button><button data-prompt="Помоги спланировать проект: начни с уточнения цели"><span data-i="calendar"></span>Спланировать проект</button><button data-prompt="Помоги разобраться в сложной теме простыми словами"><span data-i="layers"></span>Разобраться в теме</button><button id="quickPhoto"><span data-i="image"></span>Разобрать фото</button></div>
<div class="composer" id="composer"><div id="attachmentPreview" class="attachment" hidden><img id="attachmentImage" alt="Приложенное изображение"><span id="attachmentName"></span><button class="icon-button" id="removeAttachment"><span data-i="x"></span></button></div><textarea id="messageInput" rows="1" placeholder="Сообщение для META" aria-label="Сообщение"></textarea><div class="composer-controls"><div><button class="icon-button" id="attachButton" title="Добавить фото"><span data-i="paperclip"></span></button><button class="icon-button" id="imageButton" title="Изображение"><span data-i="image"></span></button></div><div><span class="compose-status" id="composeStatus">Локальная META</span><button class="send" id="sendButton" title="Отправить"><span data-i="arrow-up"></span></button></div></div></div></div>
</div></div>
<div class="overlay" id="overlay" hidden><section class="settings-shell" role="dialog" aria-modal="true" aria-label="Настройки META"><header class="settings-head"><div><small>META · ПАРАМЕТРЫ</small><h2 id="settingsTitle">Настройки</h2></div><button class="icon-button" id="closeOverlay" title="Закрыть"><span data-i="x"></span></button></header><div class="settings-layout"><nav class="settings-nav" id="settingsNav">
<button data-page="general"><span data-i="settings"></span>Общее</button><button data-page="interface"><span data-i="sliders"></span>Интерфейс</button><button data-page="personal"><span data-i="user"></span>Персонализация</button><button data-page="memory"><span data-i="brain"></span>Память</button><button data-page="data"><span data-i="shield"></span>Данные и приватность</button><button data-page="account"><span data-i="user-round"></span>Учётная запись</button><button data-page="connections"><span data-i="link"></span>Подключения</button><button data-page="about"><span data-i="info"></span>О программе</button></nav><div class="settings-body" id="settingsBody"></div></div></section></div>
<div class="overlay mini-overlay" id="auxOverlay" hidden><section class="aux-shell"><header class="settings-head"><h2 id="auxTitle">Заметки</h2><button class="icon-button" id="closeAux"><span data-i="x"></span></button></header><div id="auxBody"></div></section></div>
<div class="overlay auth-overlay" id="authOverlay" hidden><section class="auth-dialog"><div class="auth-logo">M</div><h2 id="authTitle">Учётная запись META</h2><p id="authDescription">Локальный профиль для этого компьютера</p><form id="authForm"><label id="accountNameLabel">Имя<input id="accountName" autocomplete="nickname" maxlength="60" placeholder="Как тебя называть"></label><label id="accountEmailLabel">Email (необязательно, без проверки)<input id="accountEmail" type="email" autocomplete="email" placeholder="example@mail.com"></label><label>Пароль<input id="accountPassword" type="password" autocomplete="current-password" minlength="8" required placeholder="Не менее 8 символов"></label><p id="authError" class="error-text"></p><button class="action-primary" id="authSubmit" type="submit">Продолжить</button></form><p class="fineprint">Локальный вход: пароль проверяется на этом устройстве. Email-коды и синхронизация пока не реализованы.</p></section></div>
<div class="toast-stack" id="toasts"></div><input type="file" id="imagePicker" accept="image/png,image/jpeg,image/webp" hidden><script src="/app.js"></script></body></html>
